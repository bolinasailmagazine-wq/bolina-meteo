{"name": "Aggiorna Meteo ambiente", "on": {"schedule": [{"cron": "30 5,17 * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"update": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.11", "cache": "pip", "cache-dependency-path": "requirements-ambiente.txt"}}, {"run": "pip install -r requirements-ambiente.txt"}, {"name": "Dati ambientali", "run": "python fetch_ambiente.py .", "env": {"COPERNICUSMARINE_SERVICE_USERNAME": "${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}", "COPERNICUSMARINE_SERVICE_PASSWORD": "${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}"}}, {"name": "Commit", "run": "git config user.name meteo-bot && git config user.email meteo-bot@users.noreply.github.com && git add ambiente.json dettaglio_mare.json && (git diff --cached --quiet || (git commit -m 'Aggiorna ambiente.json' && git pull --rebase && git push))"}]}}}
